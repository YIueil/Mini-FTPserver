name: rust-release

on:
  push:
    tags: ["rust-v*"]

permissions:
  contents: write

defaults:
  run:
    working-directory: rust
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            gui: true
          # aarch64-linux 以服务器场景为主，且 cross 容器内 arm64 GTK 依赖脆弱，仅打包 CLI
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            gui: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            gui: true
          - target: x86_64-apple-darwin
            os: macos-13
            gui: true
          - target: aarch64-apple-darwin
            os: macos-latest
            gui: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # mini-ftpd-gui 的 Linux 托盘后端（gtk/libappindicator/libxdo）
      - name: Install GUI system deps (Linux x86_64)
        if: matrix.gui && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libappindicator3-dev libxdo-dev

      - name: Build
        env:
          USE_CROSS: ${{ matrix.cross }}
          TARGET: ${{ matrix.target }}
          BUILD_GUI: ${{ matrix.gui }}
        run: |
          TOOL="cargo"
          if [ "$USE_CROSS" = "true" ]; then TOOL="cross"; fi
          PKGS="-p mini-ftpd"
          if [ "$BUILD_GUI" = "true" ]; then PKGS="$PKGS -p mini-ftpd-gui"; fi
          $TOOL build --release --target "$TARGET" $PKGS --verbose

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          BUILD_GUI: ${{ matrix.gui }}
        run: |
          VERSION="${GITHUB_REF_NAME#rust-v}"
          BIN="target/$TARGET/release/mini-ftpd"
          GUI_BIN="target/$TARGET/release/mini-ftpd-gui"
          STAGE="mini-ftpd-$VERSION-$TARGET"
          mkdir -p "dist/$STAGE"
          if [[ "$TARGET" == *windows* ]]; then
            cp "$BIN.exe" "dist/$STAGE/mini-ftpd.exe"
            if [ "$BUILD_GUI" = "true" ]; then cp "$GUI_BIN.exe" "dist/$STAGE/mini-ftpd-gui.exe"; fi
          else
            cp "$BIN" "dist/$STAGE/mini-ftpd"
            if [ "$BUILD_GUI" = "true" ]; then cp "$GUI_BIN" "dist/$STAGE/mini-ftpd-gui"; fi
          fi
          cp config.example.toml README.md "dist/$STAGE/"
          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            7z a "$STAGE.zip" "$STAGE"
          else
            tar -czf "$STAGE.tar.gz" "$STAGE"
          fi
          rm -rf "$STAGE"
          sha256sum * > "SHA256SUMS-$TARGET.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: rust/dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: mini-ftpd ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
